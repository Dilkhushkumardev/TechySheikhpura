<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Techy Sheikhpura '26 | Flagship Technical Fest</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License - https://github.com/rafgraph/spa-github-pages
      // Redirects non-root requests to index.html preserving route, query and hash
      (function() {
        var l = window.location;
        var pathname = l.pathname;
        var segments = pathname.split('/').filter(Boolean);
        
        // If hosted on GitHub Pages repository subpath (/TechySheikhpura/...)
        var isRepoPath = segments.length > 0 && segments[0].toLowerCase() === 'techysheikhpura';
        var pathSegmentsToKeep = isRepoPath ? 1 : 0;
        
        var repoPrefix = pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
        var routePath = pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
        
        var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          repoPrefix + '/?/' + routePath +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash;
          
        l.replace(redirectUrl);
      })();
    </script>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 0;
        background-color: #020003;
        color: #f5d0fe;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .loader {
        width: 48px;
        height: 48px;
        border: 3px solid rgba(217, 70, 239, 0.2);
        border-top-color: #d946ef;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      p {
        font-size: 13px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: #e2e8f0;
      }
    </style>
  </head>
  <body>
    <div class="loader"></div>
    <p>Connecting to Techy Sheikhpura Fest Portal...</p>
  </body>
</html>
