<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="TechySheikhpura '26 — GEC Sheikhpura Flagship Technical Festival">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020003" />
      <stop offset="50%" stop-color="#11041b" />
      <stop offset="100%" stop-color="#050714" />
    </linearGradient>
    <radialGradient id="glowLeft" cx="18%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="84%" cy="78%" r="48%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
