    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.65" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)" />
  <rect width="1200" height="320" rx="20" fill="url(#grid)" />
  <rect width="1200" height="320" rx="20" fill="url(#glowLeft)" />
  <rect width="1200" height="320" rx="20" fill="url(#glowRight)" />
  <rect x="1.5" y="1.5" width="1197" height="317" rx="19" fill="none" stroke="url(#strokeGrad)" stroke-width="2" />

  <!-- Top Pill Badge -->
  <rect x="415" y="42" width="370" height="34" rx="17" fill="#1b0a2a" stroke="#d946ef" stroke-opacity="0.55" stroke-width="1.2" />
  <circle cx="437" cy="59" r="4.5" fill="#10b981" />
  <text x="608" y="64" text-anchor="middle" fill="#f5d0fe" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">
