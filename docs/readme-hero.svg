    <rect x="200" y="238" width="175" height="36" rx="10" fill="#12091c" stroke="#d946ef" stroke-opacity="0.45" />
    <text x="287.5" y="261" fill="#f0abfc">14+ TECH EVENTS</text>

    <rect x="395" y="238" width="190" height="36" rx="10" fill="#12091c" stroke="#a855f7" stroke-opacity="0.45" />
