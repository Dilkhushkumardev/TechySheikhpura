# This workflow will trigger Datadog Synthetic tests within your Datadog organisation
# For more information on running Synthetic tests within your GitHub workflows see: https://docs.datadoghq.com/synthetics/cicd_integrations/github_actions/

name: Run Datadog Synthetic tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Datadog Synthetic Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Datadog credentials
        id: dd-check
        env:
          DD_API_KEY: ${{ secrets['DD_API_KEY'] }}
          DD_APP_KEY: ${{ secrets['DD_APP_KEY'] }}
        run: |
          if [ -n "$DD_API_KEY" ] && [ -n "$DD_APP_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Datadog credentials detected. Preparing to run synthetic tests."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Datadog Synthetics::Skipping Datadog tests because DD_API_KEY / DD_APP_KEY secrets are not configured in GitHub repository secrets (Settings -> Secrets and variables -> Actions)."
          fi

      - name: Run Datadog Synthetic tests
        if: steps.dd-check.outputs.configured == 'true'
        uses: DataDog/synthetics-ci-github-action@v4.1.1
        with:
          api-key: ${{ secrets['DD_API_KEY'] }}
          app-key: ${{ secrets['DD_APP_KEY'] }}
          test-search-query: 'tag:e2e-tests'
